apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trucker-mobile.fullname" . }}
  labels:
    {{- include "trucker-mobile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trucker-mobile.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trucker-mobile.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trucker-mobile
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metro
              containerPort: {{ .Values.port }}
          env:
            - name: METRO_PORT
              value: {{ .Values.port | quote }}
            - name: REACT_NATIVE_PACKAGER_HOSTNAME
              value: {{ required "hostname is required" .Values.hostname | quote }}
            - name: EXPO_PUBLIC_API_URL
              value: {{ .Values.apiUrl | quote }}
            {{- with .Values.appName }}
            - name: APP_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.expoToken.secretName }}
            - name: EXPO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.expoToken.key }}
            # Expo CLI never registers a development session in CI mode.
            - name: CI
              value: "false"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /status
              port: metro
            initialDelaySeconds: 10
            periodSeconds: 10
          # Lenient: bundling can keep Metro busy for a while.
          livenessProbe:
            httpGet:
              path: /status
              port: metro
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
