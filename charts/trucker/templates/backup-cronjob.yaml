{{- if and .Values.backup.enabled .Values.persistence.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "trucker.fullname" . }}-backup
  labels:
    {{- include "trucker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # The data volume is ReadWriteOnce, so run next to the app pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "trucker.selectorLabels" . | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: TZ
                  value: {{ .Values.backup.timeZone | default "UTC" | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  out="/backups/workouts-$(date +%Y%m%d-%H%M%S).db"
                  # .backup takes a consistent snapshot even while the app writes.
                  sqlite3 {{ .Values.persistence.mountPath }}/workouts.db ".backup '$out'"
                  gzip "$out"
                  echo "Wrote $out.gz"
                  find /backups -name 'workouts-*.db.gz' -type f -mtime +{{ sub (int .Values.backup.retentionDays) 1 }} -print -delete
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.persistence.mountPath }}
                - name: backups
                  mountPath: /backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "trucker.fullname" . }}-data
            - name: backups
              hostPath:
                path: {{ .Values.backup.hostPath }}
                type: DirectoryOrCreate
{{- end }}