name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            image: ${{ github.repository }}
          - name: mobile
            context: ./mobile
            image: ${{ github.repository }}-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-helm-chart:
    # Only release tags (vX.Y.Z) bump the chart; pushes to main just publish images.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump chart versions and image tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for chart in charts/trucker charts/trucker-mobile; do
            sed -i -E "s/^version:.*/version: ${VERSION}/" "${chart}/Chart.yaml"
            sed -i -E "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${chart}/Chart.yaml"
            sed -i -E "s/^(  tag:).*/\1 ${VERSION}/" "${chart}/values.yaml"
          done
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/*/Chart.yaml charts/*/values.yaml
          if git diff --cached --quiet; then
            echo "Helm charts already at ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git commit -m "Bump Helm charts to ${GITHUB_REF_NAME#v}"
          git push origin main
