apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trucker-mobile.fullname" . }}
  labels:
    {{- include "trucker-mobile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trucker-mobile.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trucker-mobile.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trucker-mobile
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              {{- if .Values.hostPort }}
              hostPort: {{ .Values.hostPort }}
              {{- end }}
          env:
            - name: API_UPSTREAM
              value: {{ .Values.apiUpstream | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
