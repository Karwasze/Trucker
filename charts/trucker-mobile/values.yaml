replicaCount: 1

image:
  repository: ghcr.io/karwasze/trucker-mobile
  tag: 0.2.0
  pullPolicy: IfNotPresent

# Metro listens here. It advertises <hostname>:<port> to Expo Go, so the
# Service exposes the same port number.
port: 8081

# Address Expo Go uses to reach Metro (the host in the exp:// URL).
# Must resolve on the phone and match the Service below.
hostname: trucker-metro.tail135e5e.ts.net

# API the app talks to in dev mode; Metro inlines it as EXPO_PUBLIC_API_URL.
apiUrl: https://trucker.tail135e5e.ts.net

# App name shown in Expo Go (overrides "name" in app.json via APP_NAME).
# Empty: use the name from app.json.
appName: Trucker Prod

# Expo Go needs plain HTTP on the Metro port, so expose it as a Tailscale
# LoadBalancer (a tailnet device named by tailscale.com/hostname) rather than
# an HTTPS Ingress.
service:
  type: LoadBalancer
  loadBalancerClass: tailscale
  annotations:
    tailscale.com/hostname: trucker-metro

# Expo account Metro registers with, so the server shows up under
# "Development servers" in Expo Go for that account. Create an access token at
# https://expo.dev/settings/access-tokens, store it in a Secret:
#   kubectl create secret generic trucker-mobile-expo -n trucker --from-literal=token=<token>
# and set secretName. Empty: not registered; open the exp:// URL by hand.
expoToken:
  secretName: ""
  key: token

env:
  - name: TZ
    value: "Europe/Warsaw"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
