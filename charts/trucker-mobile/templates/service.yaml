apiVersion: v1
kind: Service
metadata:
  name: {{ include "trucker-mobile.fullname" . }}
  labels:
    {{- include "trucker-mobile.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  selector:
    {{- include "trucker-mobile.selectorLabels" . | nindent 4 }}
  ports:
    - name: metro
      port: {{ .Values.port }}
      targetPort: metro
